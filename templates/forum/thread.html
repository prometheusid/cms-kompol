{% extends 'base.html' %} {% block content %}
<div class="container-sm">
  <div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Forum</h1>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <h4 class="forum-title" style="color: black; font-weight: bold">
        {{forum.forum_judul}}
      </h4>

      <br />
      <p>{{forum.forum_isi|safe}}</p>
      <div class="bottom">
        <p class="timestamp">10/10/2022</p>
        <p class="comment-count">2 Comment</p>
      </div>
      <textarea></textarea>
      <button class="button-comment btn btn-sm btn-primary">add comment</button>
      <div class="comments">
        <div class="comment-content">wow amazing, keep it up</div>
        <div class="top-comment">
          <p class="user">user10</p>
          <p class="comment-ts">10/12/2022</p>
        </div>
        <div class="comment-content">Bagus banget,saya setuju</div>
        <div class="top-comment">
          <p class="user">user200</p>
          <p class="comment-ts">11/12/2022</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock%}
