{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="col">
        <div class="row mt-3">
            <button class="btn btn-primary">
                <a style="text-decoration: none; color: white;" href="{{ url_for('tambahinfo') }}">Tambah Info Baru</a>
            </button>
        </div>
        <div class="row mt-3">
            {% for row in data%}
            <div class="card border-info">
                <div class="card-header">
                    <div class="timestamp">
                        {{row['created_at']}}
                    </div>
                    <div class="timestamp">
                        {{row['user_id']}}
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title">{{row['judul_info']}}</h5>
                    <p class="card-text">
                        <br>
                        {{row['isi_info']}}
                    </p>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
{% endblock %}
