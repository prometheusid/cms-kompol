{% extends '/public/pub_base.html' %} {% block content %}
<section class="py-5">
  <div class="container">
    <div class="row">
      <div class="col">
        <form action="/pub_info/tambahinfo" method="POST">
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Judul Info</label
            >
            <input
              type="text"
              class="form-control"
              id="judul-info"
              name="judul-info"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Isi Info</label>
            <textarea
              class="form-control"
              id="summernote"
              rows="3"
              name="isi-info"
            ></textarea>
          </div>
          <button type="submit" name="submit" class="btn btn-primary">
            Simpan
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
<script>
  $("#summernote").summernote({
    placeholder: "Hello stand alone ui",
    tabsize: 2,
    height: 120,
    toolbar: [
      ["style", ["style"]],
      ["font", ["bold", "underline", "clear"]],
      ["color", ["color"]],
      ["para", ["ul", "ol", "paragraph"]],
      ["table", ["table"]],
      ["insert", ["link", "picture", "video"]],
      ["view", ["fullscreen", "codeview", "help"]],
    ],
  });
</script>
{% endblock %}
