{% extends '/public/pub_base.html' %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="d-sm-flex align-items-center justify-content-between mb-4" style="margin-top: 2rem">
            <h1 class="h3 mb-0 text-white-800"></h1>
        </div>
        <div class="card shadow mb-4" style="background-color: #1abc9c;">
            <div class="card-body">
                <p>
                    <h4 style="color: white;">{{data.lapkun_judul}}</h4>
                </p>
                <div class="bottom">
                    <p style="margin-right: 1.5em; color: white;">Oleh : {{data.nama_user}}</p>
                    <p style="margin-right: 1.5em; color: white;">{{data.created_at}}</p>
                </div>
            </div>
        </div>
        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="bottom">
                    <p class="comment-count">{{counting}} comment</p>
                </div>
                <p>{{data.lapkun_isi|safe}}</p><br>
            </div>
        </div>
