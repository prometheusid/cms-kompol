<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Forum</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <!-- css -->
    <link
      rel="stylesheet"
      href="{{url_for ('static', filename='css/style.css')}}"
    />
    <!-- Custom fonts for this template-->
    <link
      href="{{url_for ('static', filename='css/all.min.css')}}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{url_for ('static', filename='css/fontawesome/all.min.css')}}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles for this template-->
    <link
      href="{{url_for ('static', filename='css/sb-admin-2.min.css')}}"
      rel="stylesheet"
    />

    <style>
      .thread-link {
        text-decoration: none;
        color: black;
      }

      .forum-title,
      ol {
        margin: 0;
      }

      .comment-count {
        margin-left: 55rem;
      }

      .top-bar {
        background-color: skyblue;
      }

      .main {
        background-color: #f6f6ef;
        padding: 10px 15px;
      }

      .row {
        padding: 5px 0;
      }

      .bottom {
        display: flex;
        color: grey;
        font-size: 12px;
      }

      .timestamp {
        margin-top: -10px;
      }
    </style>
  </head>

  <body class="bg-gradient-primary">
    <!-- Navbar -->
    <nav
      class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary shadow"
    >
      <div class="container">
        <a class="navbar-brand" href="{{url_for ('index')}}"
          >Komunikasi Politik</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="{{url_for ('index')}}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="{{url_for ('forum')}}"
                >Forum</a
              >
            </li>
          </ul>
          <form class="d-flex">
            <input
              class="form-control me-2"
              type="search"
              placeholder="cari"
              aria-label="Search"
            />
            <button class="btn btn-success" type="submit">Cari</button>
          </form>
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li>
              <a class="ms-3" style="color: white" href="{{url_for('login')}}"
                ><i class="fas fa-user"> &nbsp; {{session['name']}}</i></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- end Navbar -->
    <div class="jumbotron">
      <div
        class="d-sm-flex align-items-center justify-content-between mb-4"
        style="margin-top: 2rem"
      >
        <h1 class="h3 mb-0 text-white-800">Forum</h1>
        <!-- <a
          href="#"
          class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
          ><i class="fas fa-download fa-sm text-white-50"></i> Generate Report</a
        > -->
      </div>
      <div class="card shadow mb-4">
        <div class="card-body">
          <ol>
            <li class="row">
              <a class="thread-link" href="{{url_for('thread')}}">
                <div class="row">
                  <h4 class="forum-title">Judul Diskusi / Forum</h4>
                  <p class="comment-count">10/10/2022</p>
                </div>
                <div class="bottom">
                  <p class="timestamp">2 comments</p>
                </div>
              </a>
            </li>
          </ol>
        </div>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/8da0a2e753.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="{{url_for ('static', filename='js/jquery.min.js')}}"></script>
    <script src="{{url_for ('static', filename='js/bootstrap.bundle.min.js')}}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{{url_for ('static', filename='js/jquery.easing.min.js')}}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{{url_for ('static', filename='js/sb-admin-2.min.js')}}"></script>

</html>
