{% extends 'base.html' %}
{% block content %}
<!-- content -->
<!-- forum -->
<div class="container">
    <div class="top-bar">
        <h1 class="forum">
            Forum
        </h1>
    </div>
    <div class="main">
        <ol>
            <li class="row">
                <a class="thread-link" href="{{url_for('thread')}}">
                    <h4 class="-forum-title">
                        Judul Diskusi / Forum
                    </h4>
                    <div class="bottom">
                        <p class="timestamp">
                            10/10/2022
                        </p>
                        <p class="comment-count">
                            2 comments
                        </p>
                    </div>
                </a>
            </li>
        </ol>
    </div>
</div>
<style>
    .thread-link {
        text-decoration: none;
        color: black;
    }

    .forum-title,
    ol {
        margin: 0;
    }

    .comment-count {
        margin: 5px 0;
    }

    .top-bar {
        background-color: skyblue;
    }

    .main {
        background-color: #F6F6EF;
        padding: 10px 15px;
    }

    .row {
        padding: 5px 0;
    }

    .bottom {
        display: flex;
        color: grey;
        font-size: 12px;
    }

    .timestamp {
        padding-right: 10px;
        margin: 5px 0;
    }
</style>

<!-- end forum -->
<!-- end content -->

{% endblock%}
